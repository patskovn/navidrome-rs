[package]
name = "navidrome-rs"
description = "A tui client for connecting to subsonic media servers"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/patskovn/navidrome-rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
dirs = "6.0.0"
futures = "0.3.33"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.33"
opensubsonic = "0.4.0"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "charset", "system-proxy", "query", "json"] }
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12.2"
spectrum-analyzer = "1.8.0"
stream-download = "0.24.2"
tca-rs = "0.2"
tokio = { version = "1.53.1", features = ["full"] }
tui-textarea = { version = "0.8", package = "ratatui-textarea" }

# Now Playing: the Control Centre tile, media keys, headset buttons. macOS only
# for now; the module has a no-op backend everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
# Word when the default output moves or devices come and go (`audio/watch.rs`).
# The same bindings cpal already builds, so nothing new is compiled.
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
